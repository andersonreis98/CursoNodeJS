<!DOCTYPE html>
<!-- declara que o documento é HTML5 -->
<!-- elemento raiz da página; "lang" indica o idioma -->
<html lang="en">
  <!-- cabeçalho: informações da página que não aparecem no corpo -->
  <head>
    <!-- codificação de caracteres (UTF-8 aceita acentos) -->
    <meta charset="utf-8" />
    <!-- ícone da aba; %PUBLIC_URL% é trocado pelo endereço da pasta public no build -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <!-- deixa a página responsiva em celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- cor do tema da barra do navegador no celular -->
    <meta name="theme-color" content="#000000" />
    <!-- descrição da página usada por buscadores (atributos nas linhas abaixo) -->
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <!-- título que aparece na aba do navegador -->
    <title>Get A Pet</title>
    <!-- ícone da aba do navegador (favicon) -->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  </head>
  <!-- corpo: tudo que aparece na tela -->
  <body>
    <!-- mensagem exibida quando o JavaScript está desativado -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- div onde o React vai renderizar a aplicação -->
    <div id="root"></div>
  </body>
</html>
